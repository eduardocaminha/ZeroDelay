name: Build ZeroDelay TV APK

# Builds the Android TV / Fire TV APK and publishes it to a rolling "tv-latest"
# GitHub Release, so a Fire TV can sideload it via the Downloader app from a
# stable URL:
#   https://github.com/<owner>/<repo>/releases/download/tv-latest/zerodelay-tv.apk
#
# The runner has the Android SDK preinstalled; Gradle is provided by
# gradle/actions/setup-gradle (no committed wrapper jar needed).

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk zerodelay-tv.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerodelay-tv-apk
          path: zerodelay-tv.apk

      - name: Publish to tv-latest release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-latest
          name: ZeroDelay TV (latest)
          prerelease: true
          files: zerodelay-tv.apk
